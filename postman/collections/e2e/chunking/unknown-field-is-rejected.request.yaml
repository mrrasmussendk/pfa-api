$kind: http-request
method: POST
url: '{{base_url}}/chunking/split'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "text": "One sentence.",
      "budgt": 12
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const problem = pm.response.json();
      const fields = (problem.errors || []).map(e => e.loc.join("."));
      pm.test("then: 422", () => pm.response.to.have.status(422));
      pm.test("then: a problem document", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
      });
      pm.test("then: a validation-error", () => {
        pm.expect(problem.type).to.equal("urn:pfa-api:problem:validation-error");
      });
      pm.test("then: errors name body.budgt", () => {
        pm.expect(fields).to.include("body.budgt");
      });
