$kind: http-request
method: POST
url: '{{base_url}}/chunking/split'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "text": "   ",
      "budget": 12
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("then: 422", () => pm.response.to.have.status(422));
      pm.test("then: a problem document", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
      });
      pm.test("then: detail says the text is empty", () => {
        pm.expect(pm.response.json().detail).to.match(/empty/i);
      });
