$kind: collection
name: PFA e2e
description: |-
  The BDD scenarios in tests/e2e, one request each: tests/e2e/<feature>/<name>.json is run by
  <feature>/<name>.request.yaml and its afterResponse tests assert the scenario's `then`.
  `heimdall e2e` starts the service and overrides base_url with --env-var.
variables:
  - key: base_url
    value: 'http://127.0.0.1:8000'
